minimum_pre_commit_version: 4.7.0
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: node node_modules/eslint/bin/eslint.js --fix --max-warnings=0
        language: system
        types: [javascript]
      - id: stylelint
        name: Stylelint
        entry: node node_modules/stylelint/bin/stylelint.mjs --fix --max-warnings=0
        language: system
        types: [scss]
      - id: php-lint
        name: PHP syntax
        entry: php -l
        language: system
        types: [php]
      - id: prettier
        name: Prettier
        entry: node node_modules/prettier/bin/prettier.cjs --write --list-different --ignore-unknown --log-level=warn
        language: system
        types: [file]
        exclude: ^(package-lock\.json$|images/|styles/)
